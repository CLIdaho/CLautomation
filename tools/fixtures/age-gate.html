<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Age gate fixture</title>
<!--
  Stands in for Cloud Hub's 21+ gate in the smoke test. It reproduces the two
  properties that made the real one impossible to click through:

    1. the overlay is position:fixed, so offsetParent reads null even while it
       is plainly on screen
    2. it is dismissed by fading opacity and dropping pointer-events, never by
       display:none

  Any gate detection that leans on offsetParent or display will fail here the
  same way it failed in production. Served from the site's own origin so the
  preview takes the same-origin path.
-->
<style>
  body { margin: 0; height: 300vh; background: #0b0e17; color: #e8ecf6;
         font: 16px/1.5 system-ui, sans-serif; }
  #ageGate { position: fixed; inset: 0; z-index: 100; display: flex;
             align-items: center; justify-content: center;
             background: rgba(4,5,12,.85); opacity: 1; transition: opacity .4s ease; }
  #ageGate.hidden { opacity: 0; pointer-events: none; }
  #content { padding: 40px; }
</style>
</head>
<body>
  <div id="ageGate" role="dialog" aria-modal="true">
    <button id="ageYes" style="padding:14px 26px">Yes, I'm 21+</button>
  </div>
  <div id="content"><h1>Behind the gate</h1></div>
  <script>
    document.getElementById("ageYes").addEventListener("click", function () {
      document.getElementById("ageGate").classList.add("hidden");
    });
  </script>
</body>
</html>
